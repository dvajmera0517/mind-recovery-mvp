[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mind-recovery-mvp"
version = "0.1.0"
description = "Local MVP prototype of a pharmacy-triggered nutrient-depletion recommendation engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "xhtml2pdf>=0.2.14",
    "python-dotenv>=1.0",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mind_recovery_mvp = ["templates/*.html"]

[tool.pytest.ini_options]
markers = [
    "integration: hits real external services (USDA FoodData Central, RxClass, openFDA, Claude). Excluded by default; run explicitly with `pytest -m integration`.",
]
addopts = "-m 'not integration'"
